{# A POST button carrying the CSRF token and a return address. #}
{% macro post(action, label, cls="", fields={}) -%}
  <form method="post" action="{{ action }}" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ request.full_path.rstrip('?') }}">
    {% for k, v in fields.items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
    <button class="{{ cls }}">{{ label }}</button>
  </form>
{%- endmacro %}

{% macro card(p, link=true) -%}
  <figure class="card{% if p.close_call %} close{% endif %}">
    {% if link %}<a href="{{ url_for('moment', moment_id=p.moment_id) }}">{% endif %}
      <img src="{{ url_for('thumb', sha=p.sha256, size=320) }}" loading="lazy" alt="{{ p.name }}">
    {% if link %}</a>{% endif %}
    <figcaption>
      <span class="name">{{ p.name }}</span>
      {% if p.shots > 1 %}<span class="pill">{{ p.shots }} shots</span>{% endif %}
      {% if p.copies %}<span class="pill" title="Same picture saved more than once; extra copies are in _duplicates">+{{ p.copies }} duplicate{{ "" if p.copies == 1 else "s" }}</span>{% endif %}
      {% if p.close_call %}<span class="pill warn">close call</span>{% endif %}
      {% if p.live_clip %}<span class="pill" title="iPhone Live Photo: the short clip is kept beside the photo">◉ Live</span>{% endif %}
      {% if p.in_tray %}<span class="pill ok">in tray</span>{% endif %}
      {% if p.people %}<div class="people">{{ p.people }}</div>{% endif %}
      {% if p.tags %}<div class="tags">#{{ p.tags.replace(', ', ' #') }}</div>{% endif %}
      {% if p.posts %}<div class="muted">posted in: {{ p.posts }}</div>{% endif %}
    </figcaption>
  </figure>
{%- endmacro %}


{% macro video_card(v) -%}
  <figure class="card video">
    {% if playable(v.ext) %}
      <video controls preload="none" poster="{{ url_for('video_poster', sha=v.sha256) }}"
             src="{{ url_for('video_file', sha=v.sha256) }}"></video>
    {% else %}
      <img src="{{ url_for('video_poster', sha=v.sha256) }}" loading="lazy" alt="{{ v.name }}">
    {% endif %}
    <figcaption>
      <span class="pill">🎬 {{ v.duration|duration or "video" }}</span>
      <span class="name">{{ v.name }}{{ v.ext }}</span>
      <div class="muted path" title="Open in File Explorer or a video player">{{ video_path(v.library_path) }}</div>
      {% if not playable(v.ext) %}<div class="muted">This format won't play in the browser. Open it from the path above.</div>{% endif %}
    </figcaption>
  </figure>
{%- endmacro %}
